<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대통령 시뮬레이션 : 5년</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17202a;color:#eef2f5;font-family:Arial,"Noto Sans KR",sans-serif;overflow:hidden}
#game{height:100vh;display:flex;flex-direction:column}
#top{height:92px;background:#202a34;border-bottom:2px solid #3a4652;padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;overflow-x:auto}
.stat{min-width:100px;background:#293541;border:1px solid #465360;border-radius:8px;padding:6px 9px;flex-shrink:0}
.stat .name{font-size:11px;color:#aeb9c3}.stat .val{font-size:17px;font-weight:bold}
.bar{height:4px;background:#111820;border-radius:4px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:#d7dde2;transition:width .4s}
#city{position:relative;flex:1;overflow:hidden;background:linear-gradient(#93a8b7 0 43%,#536976 43% 45%,#35505e 45% 100%)}
.sky{position:absolute;inset:0 0 57% 0;background:linear-gradient(#8199a8,#b8c6cc);opacity:.85}
.water{position:absolute;left:0;right:0;bottom:0;height:30%;background:#345463}
.water:before{content:"";position:absolute;left:0;right:0;top:14px;height:2px;background:#557681;box-shadow:0 20px #557681,0 42px #557681}
.city-buildings{position:absolute;left:0;right:0;bottom:30%;height:45%;display:flex;align-items:flex-end;gap:6px;padding:0 3%}
.building{width:5%;min-width:28px;background:#66757d;border:2px solid #46535b;position:relative;transition:.5s}
.building:before{content:"";position:absolute;inset:8px 5px;background:repeating-linear-gradient(90deg,#c8d1d3 0 4px,transparent 4px 10px),repeating-linear-gradient(0deg,#c8d1d3 0 4px,transparent 4px 11px);opacity:.45}
.building.old{filter:grayscale(.7);background:#55504b;border-color:#403d39;transform:skew(-1deg)}
.building.empty:after{content:"";position:absolute;bottom:-2px;left:0;right:0;height:7px;background:#34302d}
#cityLabel{position:absolute;top:12px;left:16px;background:#202a34cc;border:1px solid #53616c;padding:6px 10px;border-radius:6px;font-size:12px}
#warning{position:absolute;right:16px;top:12px;max-width:340px;background:#7b3e3ecc;border:1px solid #a65b5b;padding:7px 11px;border-radius:6px;font-size:12px;display:none}
#dialog{height:250px;background:#202a34;border-top:2px solid #465360;padding:14px 16px;display:flex;flex-direction:column}
#meta{font-size:13px;color:#aeb9c3;margin-bottom:6px}
#text{font-size:17px;line-height:1.4;min-height:52px}
#choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.choice{background:#2c3945;color:#f2f5f7;border:1px solid #53616d;border-radius:8px;padding:11px;text-align:left;cursor:pointer;font-size:13.5px;min-height:58px;transition:.15s}
.choice:hover{background:#394957;border-color:#91a0ab}
.choice small{display:block;color:#aeb9c3;margin-top:4px;font-size:11px}
#footer{height:32px;background:#171f27;display:flex;justify-content:space-between;align-items:center;padding:0 16px;color:#87949e;font-size:11px}
#ending{position:absolute;inset:0;background:#10161bcc;display:none;align-items:center;justify-content:center;z-index:30}
.endbox{width:min(640px,92%);background:#202a34;border:1px solid #697782;border-radius:12px;padding:26px;box-shadow:0 20px 70px #0008}
.endbox h1{margin-top:0;font-size:24px}.endbox p{line-height:1.5;font-size:15px;white-space:pre-wrap}
.endbox button{padding:10px 18px;border:0;border-radius:7px;cursor:pointer;background:#3a7bd5;color:#fff;font-size:14px;margin-top:12px}
@media(max-width:900px){#top{height:100px}.stat{min-width:78px;padding:4px 6px}.stat .val{font-size:14px}#dialog{height:280px}#text{font-size:15px}.choice{font-size:12.5px;padding:8px}}
</style>
</head>

    <div id="meta"></div>
    <div id="text"></div>
    <div id="choices"></div>

  <div id="footer"><span id="progress"></span><span>선택은 누적되고, 일부 효과는 뒤늦게 나타납니다.</span></div>
</div>
<div id="ending"><div class="endbox"><h1 id="endTitle"></h1><p id="endText"></p><button onclick="location.reload()">다시 시작</button></div></div>

/* ===================== 적용 & 연쇄 ===================== */
function apply(effect){
  if(typeof effect === "function") effect = effect();
  for(const [k,v] of Object.entries(effect||{})){
    if(k in S) S[k] = clamp(S[k] + (typeof v === "number" ? v : 0));
  }
  // 연쇄 효과
  S.D = clamp(S.D + Math.max(0,50-S.T)*0.05 + Math.max(0,50-S.S)*0.03 - Math.max(0,S.T-50)*0.03);
  S.S = clamp(S.S + (S.M-50)*0.04 + (S.T-50)*0.03 - S.D*0.02);
  S.O = clamp(S.O + S.D*0.04 + (50-S.S)*0.03);
  S.E = clamp(S.E + (S.S-S.O)*0.04 + S.T*0.015 - S.D*0.02);
  S.H = clamp(S.H + (S.Q-50)*0.025 - (S.B-50)*0.03 + (S.K-50)*0.02);
  S.J = clamp(S.J + (S.Q-50)*0.025 + (S.K-50)*0.02 - (S.B-50)*0.02);
  S.I = clamp(S.I + (S.K-50)*0.03 - (S.C-50)*0.04 + (S.T-50)*0.015);
  S.C = clamp(S.C + Math.max(0,50-S.I)*0.03 - Math.max(0,S.I-50)*0.02 + S.D*0.015);
  S.G = clamp(S.G + (S.I-50)*0.04 + (S.Q-50)*0.015);
  S.T = clamp(S.T + S.L*0.015 - S.D*0.025 + S.A*0.015);
  // 추가 시스템
  if(S.F<35){S.I=clamp(S.I-1);S.S=clamp(S.S-1);}
  if(S.I<35){S.G=clamp(S.G-1);S.C=clamp(S.C+1);}
  if(S.B>75){S.K=clamp(S.K-1);S.J=clamp(S.J-1);}
  if(S.Q<30){S.H=clamp(S.H-1);S.J=clamp(S.J-1);}
  if(S.D>70){S.T=clamp(S.T-1);S.E=clamp(S.E-1);}
  if(S.L<30){S.T=clamp(S.T-1);}
  S.O = clamp(100 - S.S + Math.round(S.D*0.25));
}

function cityScore(){
  return clamp((S.K + S.F + S.G + S.H + S.J + S.T)/6);
}

function checkCollapse(){
  let title="", text="";
  if(S.K<=10){title="금융위기";text="금융 시스템의 불안이 임계점을 넘어섰습니다. 정부는 더 이상 정상적인 국정 운영을 지속하기 어렵습니다.";}
  else if(S.F<=10 && S.I<=20){title="재정·경제 붕괴";text="재정 여력과 기업투자가 동시에 무너졌습니다. 긴급 대응 국면으로 전환되며 임기가 중단됩니다.";}
  else if(S.J<=8 && S.Q<=15 && S.K<=25){title="주거·금융 복합위기";text="주거시장 충격이 금융시장으로 전이되었습니다.";}
  else if(S.L<=10 && S.T<=15){title="제도 위기";text="제도에 대한 신뢰가 임계점 아래로 떨어져 정상적인 국정 운영이 어려워졌습니다.";}
  else if(S.E<=5 && S.D>=90){title="국정 마비";text="사회갈등과 국정동력의 악화가 동시에 진행되어 정부의 정책 수행이 중단됩니다.";}
  if(title){end(title,text);return true;}
  return false;
}

/* ===================== 렌더 ===================== */
function renderStats(){
  const top=document.getElementById("top");
  top.innerHTML="";
  visible.forEach(k=>{
    const d=document.createElement("div");d.className="stat";
    d.innerHTML=`<div class="name">${labels[k]}</div><div class="val">${S[k]}</div><div class="bar"><i style="width:${S[k]}%"></i></div>`;
    top.appendChild(d);
  });
  document.getElementById("cityValue").textContent=cityScore();
  const warn=document.getElementById("warning");
  const risks=[];
  if(S.K<30) risks.push("금융시장 경고");
  if(S.F<30) risks.push("재정 경고");
  if(S.T<30) risks.push("제도신뢰 경고");
  if(S.J<30) risks.push("전세시장 경고");
  if(S.I<30) risks.push("기업투자 경고");
  if(risks.length){warn.style.display="block";warn.textContent="⚠ "+risks.join(" · ");}
  else warn.style.display="none";
  renderCity();
}
function renderCity(){
  const box=document.getElementById("buildings");
  box.innerHTML="";
  const deterioration=Math.round(100-cityScore());
  for(let i=0;i<17;i++){
    const h=40+((i*17)%55);
    const b=document.createElement("div");b.className="building";
    b.style.height=h+"%";
    if(deterioration>25 && i%3===0)b.classList.add("old");
    if(deterioration>55 && i%4===0)b.classList.add("empty");
    box.appendChild(b);
  }
}
function showEvent(){
  if(q>=events.length){finalEnding();return;}
  const e=events[q];
  document.getElementById("meta").textContent=`PART ${e.part} · ${e.n}/200 · ${e.speaker}`;
  document.getElementById("text").textContent=e.text;
  const box=document.getElementById("choices");box.innerHTML="";
  e.choices.forEach((c,i)=>{
    const btn=document.createElement("button");btn.className="choice";
    btn.innerHTML=`${i+1}. ${c[0]}<small>선택 후 결과는 즉시 또는 이후에 나타날 수 있음</small>`;
    btn.onclick=()=>choose(c[1]);
    box.appendChild(btn);
  });
  document.getElementById("progress").textContent=`${e.n} / 200  ·  PART ${e.part}`;
  renderStats();
}
function choose(effect){
  apply(effect);
  if(q%17===4 && S.F<45) delayed.push({at:q+8,effect:{S:-3,I:-2}});
  if(q%19===7 && S.B>70) delayed.push({at:q+10,effect:{K:-4,J:-3}});
  const due=delayed.filter(x=>x.at===q);
  due.forEach(x=>apply(x.effect));
  if(checkCollapse())return;
  q++;
  showEvent();
}
function finalEnding(){
  let title="임기 완주";
  let text="";
  const avg=(S.T+S.F+S.K+S.G+S.E)/5;
  if(avg>=75) text="5년의 국정 운영을 끝까지 완주했습니다. 주요 제도와 경제 지표가 비교적 안정된 상태로 다음 정부에 넘어갑니다.";
  else if(S.F<30) text="임기는 완주했지만 재정 여력이 크게 약화되었습니다. 다음 정부는 상당한 재정 부담을 떠안게 됩니다.";
  else if(S.K<35) text="임기는 완주했지만 금융시장의 불안이 남았습니다.";
  else if(S.T<35) text="임기는 완주했지만 제도에 대한 신뢰가 충분히 회복되지 않았습니다.";
  else text="임기를 완주했습니다. 성과와 부작용이 뒤섞인 복합적인 결과가 남았습니다.";
  end(title,text);
}
function end(title,text){
  document.getElementById("endTitle").textContent=title;
  document.getElementById("endText").textContent=text+
    `\n\n최종 상태 — 재정 ${S.F}, 금융 ${S.K}, 제도신뢰 ${S.T}, 고용 ${S.G}, 도시 ${cityScore()}`;
  document.getElementById("ending").style.display="flex";
}
showEvent();
